name: calvision

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_YOLO: "true"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      YOLO_CONFIG_DIR: /tmp/Ultralytics
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        exec gunicorn calvision_backend.wsgi:application --bind 0.0.0.0:8000
        --workers "$${GUNICORN_WORKERS:-1}" --timeout "$${GUNICORN_TIMEOUT:-300}"
        --access-logfile - --error-logfile -
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  staticfiles:
  media:
  caddy_data:
  caddy_config:
